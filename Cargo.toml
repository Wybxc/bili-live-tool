[package]
name = "bili-live-tool"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
async-compat = "0.2.5"
cookie_store = "0.22.1"
directories = "6.0.0"
image = { version = "0.25.10", default-features = false }
md5 = "0.8.0"
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
reqwest = { version = "0.13.2", features = ["json", "query", "cookies"] }
reqwest-middleware = { version = "0.5.1", features = ["query"] }
reqwest-tracing = "0.7.0"
reqwest_cookie_store = "0.10.0"
rfd = "0.17.2"
serde = "1.0.228"
serde_json = "1.0.149"
serde_repr = "0.1.20"
serde_urlencoded = "0.7.1"
slint = "1.16.0"
smol_str = { version = "0.3.6", features = ["serde"] }
thiserror = "2.0.18"
tokio = "1.52.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
slint-build = "1.16.0"

[profile.release]
codegen-units = 1
lto = true

[package.metadata.bundle]
name = "Bili Live Tool"
identifier = "cc.wybxc.bili-live-tool"
category = "Utilities"
